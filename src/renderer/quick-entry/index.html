<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Entry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="container" class="container">
    <div class="drag-handle"><div class="drag-handle-pill"></div></div>
    <div id="project-hint" class="project-hint hidden">saving to <span id="project-name"></span></div>
    <div class="task-row">
      <div class="input-wrapper">
        <div id="input-highlight" class="input-highlight" aria-hidden="true"></div>
        <input
          id="task-input"
          type="text"
          placeholder="Add a task..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <button id="send-button" class="send-button" type="button" title="Create task (Enter)" aria-label="Create task (Enter)" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/>
          <path d="m21.854 2.147-10.94 10.939"/>
        </svg>
      </button>
    </div>
    <div id="autocomplete-container" class="autocomplete-container hidden">
      <div class="autocomplete-list"></div>
    </div>
    <div id="parse-preview" class="parse-preview hidden"></div>
    <!-- 工具栏：与主窗口新建任务输入框下方的按钮一一对应（日期、提醒、优先级、标签、项目、备注、附加） -->
    <div id="task-toolbar" class="task-toolbar" role="toolbar">
      <button id="tool-date" class="tool-button" type="button" data-tool="date" aria-haspopup="listbox" aria-expanded="false">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>
        </svg>
        <span id="tool-date-label" class="tool-label">Date</span>
      </button>
      <button id="tool-reminder" class="tool-button" type="button" data-tool="reminder" aria-haspopup="listbox" aria-expanded="false">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>
        </svg>
        <span id="tool-reminder-label" class="tool-label">Reminder</span>
      </button>
      <button id="tool-priority" class="tool-button" type="button" data-tool="priority" aria-haspopup="listbox" aria-expanded="false">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>
        </svg>
        <span id="tool-priority-label" class="tool-label">Priority</span>
      </button>
      <button id="tool-labels" class="tool-button" type="button" data-tool="labels" aria-haspopup="listbox" aria-expanded="false">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/>
        </svg>
        <span id="tool-labels-label" class="tool-label">Labels</span>
      </button>
      <button id="tool-project" class="tool-button" type="button" data-tool="project" aria-haspopup="listbox" aria-expanded="false">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>
        </svg>
        <span id="tool-project-label" class="tool-label">Inbox</span>
      </button>
      <button id="tool-notes" class="tool-button" type="button" data-tool="notes" aria-pressed="false">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 6H3"/><path d="M15 12H3"/><path d="M17 18H3"/>
        </svg>
        <span class="tool-label">Notes</span>
      </button>
      <button id="tool-attach" class="tool-button" type="button" data-tool="attach" title="Attach">
        <svg class="tool-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
        <span class="tool-label">Attach</span>
      </button>
      <input id="attach-input" class="hidden" type="file" multiple />
    </div>
    <div id="tool-popover" class="tool-popover hidden" role="listbox"></div>
    <div id="hints-row" class="hints-row">
      <div id="today-hint-inline" class="today-hint hidden">scheduling for Today</div>
    </div>
    <textarea id="description-input" class="description-input hidden"
              placeholder="Description..." rows="1"></textarea>
    <div id="image-gallery" class="image-gallery hidden"></div>
    <div id="today-hint-below" class="today-hint hidden">scheduling for Today</div>
    <div id="obsidian-hint" class="obsidian-hint hidden">
      <span class="obsidian-hint-key">Ctrl+L</span> to link <span id="obsidian-hint-name"></span>
    </div>
    <div id="obsidian-badge" class="obsidian-badge hidden">
      <svg class="obsidian-badge-icon" width="12" height="12" viewBox="0 0 100 100">
        <path d="M68.6 2.2 32.8 19.8a4 4 0 0 0-2.2 2.7L18.2 80.1a4 4 0 0 0 1 3.7l16.7 16a4 4 0 0 0 3.6 1.1l42-9.6a4 4 0 0 0 2.8-2.3L97.7 46a4 4 0 0 0-.5-3.8L72.3 3a4 4 0 0 0-3.7-1.8z" fill="currentColor"/>
      </svg>
      <span id="obsidian-badge-name"></span>
      <button id="obsidian-badge-remove" class="obsidian-badge-remove" title="Remove link">&times;</button>
    </div>
    <div id="browser-hint" class="browser-hint hidden">
      <span class="browser-hint-key">Ctrl+L</span> to link <span id="browser-hint-name"></span>
    </div>
    <div id="browser-badge" class="browser-badge hidden">
      <svg class="browser-badge-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span id="browser-badge-name"></span>
      <button id="browser-badge-remove" class="browser-badge-remove" title="Remove link">&times;</button>
    </div>
    <div id="error-message" class="error-message" hidden></div>
    <div id="pending-indicator" class="pending-indicator hidden">
      <span id="pending-count"></span>
    </div>
  </div>
  <script type="module" src="renderer.ts"></script>
</body>
</html>
